name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # VLCKit's binary xcframework (~200 MB) sometimes times out; retry.
      - name: Resolve Swift packages
        run: |
          n=0
          until [ $n -ge 4 ]; do
            xcodebuild -resolvePackageDependencies -project PanuraPlayer.xcodeproj && exit 0
            n=$((n+1)); echo "resolve attempt $n failed, retrying in 20s..."; sleep 20
          done
          exit 1

      # Compile-check on the simulator.
      - name: Build (unsigned, simulator)
        run: |
          xcodebuild \
            -project PanuraPlayer.xcodeproj \
            -scheme PanuraPlayer \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      # Archive for a real device WITHOUT signing, then hand-package a .ipa.
      # Sideloadly / AltStore re-sign this on install with a free Apple ID.
      - name: Archive (device, unsigned)
        run: |
          xcodebuild \
            -project PanuraPlayer.xcodeproj \
            -scheme PanuraPlayer \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/PanuraPlayer.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive

      - name: Package unsigned .ipa
        run: |
          mkdir -p build/Payload
          cp -R build/PanuraPlayer.xcarchive/Products/Applications/PanuraPlayer.app build/Payload/
          (cd build && zip -qr PanuraPlayer-unsigned.ipa Payload)

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: PanuraPlayer-unsigned-ipa
          path: build/PanuraPlayer-unsigned.ipa
