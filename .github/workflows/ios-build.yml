name: iOS Build

# macOS runners bill at 10x, so a 10-minute build costs 100 of the 2,000
# included minutes. Everything here exists to keep that number down:
# build on demand, never twice at once, and never for a docs-only change.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '.gitignore'
      - 'docs/**'
      # Nothing under tools/ is in the app target — a change there cannot break
      # a build, and a macOS runner bills at 10x for finding that out.
      - 'Tools/**'

# A second push supersedes the first instead of paying for both.
concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      # VLCKit is a ~900 MB binary archive (every Apple platform). Without this it is re-resolved
      # and re-downloaded on every run, at 10x.
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml', 'Packages/**/Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      # The manifest names no domains; it hashes them with this salt. The app
      # must hold the SAME salt to match. Injected from a secret rather than
      # committed. Keep it equal to .manifest-src/salt.txt in the panura repo.
      #
      # ⚠️ This repo is PUBLIC as of 2026-08-06 and Sources/Core/ManifestSalt.swift
      # still carries the real salt, so that value is burned (see the header of
      # that file). Builds with no secret still work, they just use a salt the
      # whole internet can read. Rotation is deferred until testing is finished;
      # after it, set MANIFEST_SALT here and blank the committed literal, so the
      # secret becomes the only copy rather than an optional override.
      - name: Inject manifest salt
        env:
          MANIFEST_SALT: ${{ secrets.MANIFEST_SALT }}
        run: |
          # Trim whitespace first. salt.txt ends in a newline, and a secret pasted
          # from it carries that newline into a Swift string literal — which
          # either fails to compile or hashes differently, so no rule matches.
          MANIFEST_SALT="$(printf '%s' "$MANIFEST_SALT" | tr -d '[:space:]')"
          if [ -n "$MANIFEST_SALT" ]; then
            printf 'enum ManifestSalt {\n    static let value = "%s"\n}\n' "$MANIFEST_SALT" \
              > Sources/Core/ManifestSalt.swift
            echo "manifest salt injected from secret (overrides the committed value)"
          else
            echo "using the committed salt in Sources/Core/ManifestSalt.swift"
          fi

      # Firebase config, from a secret because this repo is public. Optional for
      # this workflow: without it the sideload IPA simply has no Firebase (the app
      # checks for the plist before configuring), which is fine for testing.
      # Must run before the archive; a build script in project.yml copies it into
      # the app only when it exists.
      - name: Write GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" > Resources/GoogleService-Info.plist
            plutil -lint Resources/GoogleService-Info.plist
            echo "Firebase config written"
          else
            echo "No GOOGLE_SERVICE_INFO_PLIST secret; building without Firebase"
          fi

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        # NO_AUTO_UPDATE: brew otherwise spends a minute or two updating itself
        # first, which at 10x is the most expensive no-op in the file.
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # VLCKit's binary archive (~900 MB) sometimes times out; retry.
      - name: Resolve Swift packages
        run: |
          n=0
          until [ $n -ge 4 ]; do
            xcodebuild -resolvePackageDependencies -project PanuraPlayer.xcodeproj && exit 0
            n=$((n+1)); echo "resolve attempt $n failed, retrying in 20s..."; sleep 20
          done
          exit 1

      # The simulator compile-check that used to run here is gone. It was a
      # second full compile of the same sources against a different SDK, and the
      # archive below already fails on any compile error. Nothing here ever runs
      # in a simulator — the IPA is the deliverable — so it bought nothing and
      # cost roughly half the build.

      # Archive for a real device WITHOUT signing, then hand-package a .ipa.
      # Sideloadly / AltStore re-sign this on install with a free Apple ID.
      - name: Archive (device, unsigned)
        run: |
          mkdir -p build
          set -o pipefail
          xcodebuild \
            -project PanuraPlayer.xcodeproj \
            -scheme PanuraPlayer \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/PanuraPlayer.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive 2>&1 | tee build/xcodebuild.log

      # Compile errors as annotations — readable through the public API without
      # signing in, which is how a failure gets diagnosed from a Windows machine
      # with CI as the only compiler. GitHub keeps ten error annotations per
      # step, so three steps surface up to thirty.
      - name: Report compile errors (1-10)
        if: failure()
        run: bash .github/scripts/annotate-errors.sh 0
      - name: Report compile errors (11-20)
        if: failure()
        run: bash .github/scripts/annotate-errors.sh 10
      - name: Report compile errors (21-30)
        if: failure()
        run: bash .github/scripts/annotate-errors.sh 20

      - name: Package unsigned .ipa
        run: |
          mkdir -p build/Payload
          cp -R build/PanuraPlayer.xcarchive/Products/Applications/PanuraPlayer.app build/Payload/
          (cd build && zip -qr PanuraPlayer-unsigned.ipa Payload)

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v5
        with:
          name: PanuraPlayer-unsigned-ipa
          path: build/PanuraPlayer-unsigned.ipa
