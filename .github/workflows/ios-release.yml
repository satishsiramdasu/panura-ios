name: iOS Release (TestFlight)

# Signed build → App Store Connect. Run by hand only: every run costs macOS
# minutes at 10x and puts a build in front of testers, neither of which should
# happen because someone pushed a comment.
#
# ── What it needs before it can work ──────────────────────────────────────────
# Five repository secrets (plus MANIFEST_SALT, below), and a paid Apple
# Developer account behind them:
#
#   APPSTORE_KEY_ID       The App Store Connect API key's id ("ABC123DEFG")
#   APPSTORE_ISSUER_ID    The issuer UUID shown above the key list
#   APPSTORE_PRIVATE_KEY  The whole .p8 file, pasted — BEGIN line to END line
#   IOS_TEAM_ID           The 10-character team id
#   GOOGLE_SERVICE_INFO_PLIST
#                         The iOS app's Firebase config, the whole plist pasted
#
# Create the key at App Store Connect → Users and Access → Integrations → App
# Store Connect API, with the **Admin** role. Apple shows the .p8 once.
#
# Admin, not App Manager. App Manager uploads builds fine, but export has to
# create the Apple Distribution certificate through cloud signing, and Apple
# only lets Admin and Account Holder do that. With App Manager the export fails
# with "Cloud signing permission error" / "No signing certificate 'iOS
# Distribution' found". Keys cannot be edited — a wrong role means a new key.
#
# No certificate or provisioning profile secrets: `-allowProvisioningUpdates`
# with that same API key lets Xcode create and download what it needs.
#
# ⚠️ That has one cost, and it is why the last step exists. A GitHub runner
# starts with an empty keychain, so every run makes Xcode mint a BRAND NEW
# Apple Development certificate — and Apple caps those per account. After a
# couple of runs the archive fails with "Your account has reached the maximum
# number of certificates" and "No profiles for 'panura.web.videoplayer' were
# found". Distribution certificates are cloud-managed and reused, so only the
# development ones pile up. The final step revokes the one this run created,
# by serial number, so the count never grows. If the cap has already been hit,
# revoke the stale ones by hand first: developer.apple.com → Certificates,
# Identifiers & Profiles → Certificates → the Apple Development rows.
#
# It does need ONE registered device (Certificates, Identifiers & Profiles →
# Devices): the archive is signed with a development profile before export
# re-signs it for the App Store, and Apple issues no development profile to a
# team with no devices. Archiving unsigned to avoid that broke framework
# signatures — see the Archive step. Managing
# a p12 and a .mobileprovision by hand is the part of iOS CI that breaks every
# twelve months when something expires.
#
# The app record must also exist in App Store Connect (bundle id
# panura.web.videoplayer) before the first upload — the API creates builds, not apps.

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: 'Version people see (e.g. 1.0). Blank keeps project.yml.'
        required: false
        default: ''

concurrency:
  group: ios-release
  cancel-in-progress: false   # never kill an upload half-done

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml', 'Packages/**/Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      # ⚠️ A release build MUST carry the rotated salt, not the one committed to
      # this public repo. Fail loudly rather than shipping the burned value:
      # every hash in the deployed manifest is reversible with it.
      - name: Inject manifest salt
        env:
          MANIFEST_SALT: ${{ secrets.MANIFEST_SALT }}
        run: |
          # Trim whitespace first. salt.txt ends in a newline, and a secret pasted
          # from it carries that newline into a Swift string literal — which
          # either fails to compile or hashes differently, so no rule matches.
          MANIFEST_SALT="$(printf '%s' "$MANIFEST_SALT" | tr -d '[:space:]')"
          if [ -z "$MANIFEST_SALT" ]; then
            echo "::error::MANIFEST_SALT is not set. A release built with the committed salt ships a manifest anyone can deanonymise."
            exit 1
          fi
          printf 'enum ManifestSalt {\n    static let value = "%s"\n}\n' "$MANIFEST_SALT" \
            > Sources/Core/ManifestSalt.swift

      # Firebase config. Required for a release: without it the app ships with
      # no Crashlytics, and nobody finds out until a crash goes unseen. Must run
      # before the archive; a build script in project.yml copies it into the
      # app only when it exists.
      - name: Write GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if [ -z "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            echo "::error::GOOGLE_SERVICE_INFO_PLIST is not set. A release without it ships with no Crashlytics or Analytics."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICE_INFO_PLIST" > Resources/GoogleService-Info.plist
          plutil -lint Resources/GoogleService-Info.plist
          # The plist names the app it belongs to. Another app's plist — or the
          # Android app's — parses fine and then reports to the wrong app.
          BUNDLE="$(/usr/libexec/PlistBuddy -c 'Print :BUNDLE_ID' Resources/GoogleService-Info.plist)"
          if [ "$BUNDLE" != "panura.web.videoplayer" ]; then
            echo "::error::GoogleService-Info.plist is for '$BUNDLE', not panura.web.videoplayer."
            exit 1
          fi

      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen

      # The build number has to rise on every upload — App Store Connect rejects
      # a repeat. The run number is monotonic and needs no state of its own.
      - name: Set version numbers
        env:
          MARKETING: ${{ inputs.marketing_version }}
          BUILD: ${{ github.run_number }}
        run: |
          if [ -n "$MARKETING" ]; then
            sed -i '' "s/MARKETING_VERSION: .*/MARKETING_VERSION: \"$MARKETING\"/" project.yml
          fi
          sed -i '' "s/CURRENT_PROJECT_VERSION: .*/CURRENT_PROJECT_VERSION: \"$BUILD\"/" project.yml
          grep -E 'MARKETING_VERSION|CURRENT_PROJECT_VERSION' project.yml

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Swift packages
        run: |
          n=0
          until [ $n -ge 4 ]; do
            xcodebuild -resolvePackageDependencies -project PanuraPlayer.xcodeproj && exit 0
            n=$((n+1)); echo "resolve attempt $n failed, retrying in 20s..."; sleep 20
          done
          exit 1

      # Apple's tools look for the key in this exact directory, by this exact
      # name. Anywhere else and they report "key not found" with no hint why.
      - name: Stage the App Store Connect key
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$PRIVATE_KEY" > ~/private_keys/AuthKey_${KEY_ID}.p8
          chmod 600 ~/private_keys/AuthKey_${KEY_ID}.p8

      # Signed archive: automatic signing, with the API key.
      #
      # This was briefly archived UNSIGNED, to dodge Apple's rule that a team
      # with no registered devices cannot get the development profile Xcode
      # archives with. The export went green and App Store Connect refused the
      # upload: the prebuilt GoogleMobileAds and UserMessagingPlatform
      # frameworks failed validation ("Invalid Signature. Code failed to satisfy
      # specified code requirement(s)"). An unsigned archive skips the
      # sign-on-copy step that re-signs embedded frameworks, and export does not
      # reliably repair it.
      #
      # So archive the ordinary way. The one cost: at least one iPhone or iPad
      # must be registered under Certificates, Identifiers & Profiles → Devices,
      # or this step fails with "Your team has no devices from which to generate
      # a provisioning profile."
      - name: Archive (signed)
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          xcodebuild \
            -project PanuraPlayer.xcodeproj \
            -scheme PanuraPlayer \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/PanuraPlayer.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            archive

      # Re-signs for distribution. -allowProvisioningUpdates with the API key
      # lets Xcode create the Apple Distribution certificate and the App Store
      # profile in the cloud on first run. That needs an Admin key.
      - name: Export .ipa (signed for App Store)
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>uploadSymbols</key><true/>
            <key>destination</key><string>export</string>
          </dict>
          </plist>
          PLIST
          xcodebuild \
            -exportArchive \
            -archivePath build/PanuraPlayer.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist build/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      # Validate first. A rejection here costs a minute; the same rejection
      # after upload costs a build number and a wait.
      - name: Validate
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        # altool can print ERROR ITMS-... and still exit 0, which turns a
        # rejected build into a green step and a build that never appears in
        # App Store Connect. The output is read, not just the exit code.
        run: |
          set -o pipefail
          xcrun altool --validate-app \
            -f build/export/*.ipa -t ios \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID" 2>&1 | tee build/validate.log
          if grep -Eq 'ERROR ITMS-|\*\*\* Error|VALIDATION FAILED' build/validate.log; then
            echo "::error::altool reported errors during validation — see above."
            exit 1
          fi

      - name: Upload to TestFlight
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        # Same as validation: the exit code alone is not proof. A real upload
        # prints a Delivery UUID, which is also what Apple support asks for when
        # a build goes missing — so it is surfaced as a notice on the run.
        run: |
          set -o pipefail
          xcrun altool --upload-app \
            -f build/export/*.ipa -t ios \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID" 2>&1 | tee build/upload.log
          if grep -Eq 'ERROR ITMS-|\*\*\* Error|UPLOAD FAILED' build/upload.log; then
            echo "::error::altool reported errors during upload — see above."
            exit 1
          fi
          UUID="$(grep -Eo 'Delivery UUID: [0-9a-fA-F-]+' build/upload.log | head -1)"
          if [ -n "$UUID" ]; then
            echo "::notice::$UUID — processing takes 15-30 minutes; a rejection arrives by email."
          else
            echo "::warning::No Delivery UUID in altool output; check App Store Connect before assuming this uploaded."
          fi

      # Crashlytics symbolication, from the archive's dSYMs. Non-fatal on
      # purpose: a failed symbol upload costs readable stack traces for this one
      # build, and must not turn an upload that already succeeded into a red run.
      - name: Upload dSYMs to Crashlytics
        continue-on-error: true
        run: |
          TOOL="$(find ~/Library/Developer/Xcode/DerivedData -path '*SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/upload-symbols' -type f 2>/dev/null | head -1)"
          if [ -z "$TOOL" ]; then
            echo "::warning::Crashlytics upload-symbols not found; this build's crash reports will be unsymbolicated."
            exit 0
          fi
          "$TOOL" -gsp Resources/GoogleService-Info.plist -p ios build/PanuraPlayer.xcarchive/dSYMs

      # Hands back the Apple Development certificate this run was issued.
      #
      # Every run is a fresh machine with an empty keychain, so
      # `-allowProvisioningUpdates` mints a new development certificate to
      # archive with, and Apple caps how many an account may hold. Left alone
      # this workflow bricks itself after a couple of runs — which is exactly
      # what happened. So the run cleans up after itself.
      #
      # Only certificates found in THIS runner's keychain are touched, matched
      # by serial number, and only ones Apple reports as DEVELOPMENT. The
      # machine is ephemeral, so anything in that keychain was put there by
      # this run — a certificate on someone's Mac cannot be caught by it.
      #
      # `always()`, because a run that failed after signing still has one to
      # give back, and non-fatal, because failing to tidy up must not turn a
      # finished upload red.
      - name: Revoke this run's development certificate
        if: always()
        continue-on-error: true
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          set -u
          security find-certificate -a -c "Apple Development" -p > /tmp/devcerts.pem 2>/dev/null || true
          if [ ! -s /tmp/devcerts.pem ]; then
            echo "No development certificate in this runner's keychain; nothing to revoke."
            exit 0
          fi
          # One PEM block per certificate; openssl reads them one at a time.
          mkdir -p /tmp/certs && rm -f /tmp/certs/*
          awk 'BEGIN{n=0} /BEGIN CERTIFICATE/{n++} {print > ("/tmp/certs/c" n ".pem")}' /tmp/devcerts.pem
          SERIALS=""
          for f in /tmp/certs/*.pem; do
            S="$(openssl x509 -in "$f" -noout -serial 2>/dev/null | cut -d= -f2)" || continue
            [ -n "$S" ] && SERIALS="$SERIALS $S"
          done
          echo "Serials held by this runner:$SERIALS"
          python3 -m pip install --quiet --disable-pip-version-check pyjwt cryptography
          SERIALS="$SERIALS" python3 - <<'PY'
          import json, os, time, urllib.request, jwt

          key_id, issuer = os.environ["KEY_ID"], os.environ["ISSUER_ID"]
          wanted = {s.strip().lstrip("0").upper() for s in os.environ["SERIALS"].split() if s.strip()}
          with open(os.path.expanduser(f"~/private_keys/AuthKey_{key_id}.p8")) as f:
              private_key = f.read()

          token = jwt.encode(
              {"iss": issuer, "iat": int(time.time()), "exp": int(time.time()) + 600, "aud": "appstoreconnect-v1"},
              private_key, algorithm="ES256", headers={"kid": key_id, "typ": "JWT"},
          )
          head = {"Authorization": f"Bearer {token}"}

          def call(method, url):
              req = urllib.request.Request(url, headers=head, method=method)
              with urllib.request.urlopen(req) as r:
                  return r.read()

          listing = json.loads(call(
              "GET",
              "https://api.appstoreconnect.apple.com/v1/certificates"
              "?filter[certificateType]=DEVELOPMENT&limit=200",
          ))
          revoked = 0
          for cert in listing.get("data", []):
              serial = (cert["attributes"].get("serialNumber") or "").lstrip("0").upper()
              if serial not in wanted:
                  continue
              call("DELETE", f"https://api.appstoreconnect.apple.com/v1/certificates/{cert['id']}")
              print(f"Revoked {cert['attributes'].get('name')} ({serial})")
              revoked += 1
          if revoked == 0:
              print("::warning::This run's development certificate was not matched, so it stays on the "
                    "account. Revoke Apple Development certificates by hand if archives start failing "
                    "with 'maximum number of certificates'.")
          PY

      # Kept because the archive holds the dSYMs: without them a crash report
      # from a tester is a list of hex addresses.
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: PanuraPlayer-release
          path: |
            build/export/*.ipa
            build/PanuraPlayer.xcarchive/dSYMs
          if-no-files-found: warn
