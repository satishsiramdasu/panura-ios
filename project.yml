name: PanuraPlayer
options:
  bundleIdPrefix: panura.web
  # 16.4 rather than 16.0: it is the floor for `presentationCompactAdaptation`,
  # which is what keeps the app's panels popovers on a phone instead of sheets
  # from the bottom. Everything 16.0 runs on runs 16.4 too, and the share of
  # devices sitting on 16.0-16.3 today is a rounding error.
  deploymentTarget:
    iOS: "16.4"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "" # set on CI via env / xcconfig
    TARGETED_DEVICE_FAMILY: "1,2" # iPhone + iPad
    CODE_SIGN_STYLE: Automatic

packages:
  # Google ships no official SPM package; SRGSSR repackages the official
  # XCFrameworks. Module is still `GoogleCast`, so `import GoogleCast` is unchanged.
  GoogleCast:
    url: https://github.com/SRGSSR/google-cast-sdk
    from: "4.8.4"
  # v12+ introduced the un-prefixed Swift API (MobileAds/InterstitialAd/Request).
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: "12.0.0"
  Swifter:
    url: https://github.com/httpswift/swifter
    from: "1.5.0"
  # Converts EasyList/uBlock ABP filter lists into Safari content-blocker JSON.
  SafariConverterLib:
    url: https://github.com/AdguardTeam/SafariConverterLib
    from: "4.3.0"
  # VLCKit 4 (libVLC 4) — every format + reliable HTTP header support
  # (Referer/User-Agent/Cookie) for gated streams, plus Picture in Picture.
  # A local package around VideoLAN's own binary xcframework; the version and
  # checksum are pinned in Packages/VLCKit4/Package.swift.
  VLCKit4:
    path: Packages/VLCKit4
  # Crashlytics + Analytics: automatic crash reports, Analytics' default events,
  # and the few playback events in Sources/Core/PlayerAnalytics.swift.
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "12.0.0"

targets:
  PanuraPlayer:
    type: application
    platform: iOS
    sources:
      - Sources
      # The asset catalog is a SOURCE entry, not a `resources:` one — XcodeGen
      # has no `resources` key and silently ignored it, so the catalog was
      # never in the build: no app icon, no launch image, and Image("AppLogo")
      # resolved to nothing.
      - Resources/Assets.xcassets
      # Same lesson as the catalog: a bundled file has to be a source entry to
      # reach the build. Without this the manifest sits in the repo and App
      # Store Connect rejects the upload for not having one.
      - Resources/PrivacyInfo.xcprivacy
      # GoogleService-Info.plist is deliberately NOT a source — see
      # postBuildScripts below.
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Panura
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Android's splash, matched: the launcher glyph centred on #0F0F0E,
        # which is also the app's background — so the launch image dissolves
        # into the first screen instead of flashing white before it.
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
          UIImageRespectsSafeAreaInsets: false
        # Firebase defaults to ALLOWING ad-personalisation signals, which
        # lets Google use Analytics data to personalise advertising. That is
        # the one route by which the App Store answer "Device ID is not used
        # for tracking" could stop being true without anyone changing a line.
        # Off, explicitly, so the binary says what the listing says.
        #
        # Revisit with ads in 1.1 — turning it on is a decision with an ATT
        # prompt attached, not a default to inherit.
        GOOGLE_ANALYTICS_DEFAULT_ALLOW_AD_PERSONALIZATION_SIGNALS: false
        # Dark only, like the Android app. Without this the system paints its
        # own chrome light while every surface we draw is near-black.
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # iPad: all four, or App Store Connect rejects the upload outright. iPad
        # multitasking (Split View, Stage Manager) requires every orientation,
        # and UIRequiresFullScreen — the old opt-out — is deprecated in iPadOS
        # 26. OrientationManager's default mask is already `.all`, so this only
        # declares what the app does at runtime.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true # extraction/browser hits arbitrary http hosts
        NSPhotoLibraryUsageDescription: Panura needs access to your videos to play and cast them.
        # Local network — required for PanuraCast and Chromecast discovery.
        #
        # ONE block only. There were briefly two, and since a later duplicate key
        # wins, the list that reached Info.plist named `_panuracast._tcp` while the
        # code published `_panura._tcp`. iOS refuses to publish a type that is not
        # declared here, which surfaces as NWError -65555 (kDNSServiceErr_NoAuth) —
        # indistinguishable from the user having denied the permission.
        #
        # The type must match PanuraCastServer.serviceType and the Android
        # SERVICE_TYPE exactly, minus the trailing dot.
        NSLocalNetworkUsageDescription: >-
          Panura needs your local network to find and cast to your Panura Android
          TV. Nothing leaves your network.
        NSBonjourServices:
          - _panura._tcp
          - _googlecast._tcp
        UIBackgroundModes:
          - audio
        # Panura's iOS app in AdMob. Per platform — Android's ~4063324505 is a
        # different app and cannot be used here.
        GADApplicationIdentifier: ca-app-pub-6998555111280991~2675221601
        # HTTPS and the system's own crypto only — no encryption of our own — so
        # the app is exempt. Without this key every single upload stops and asks.
        ITSAppUsesNonExemptEncryption: false
        # Shown by the ATT prompt, which is only ever raised when ads are on.
        # Apple rejects an app that calls ATTrackingManager without this string.
        NSUserTrackingUsageDescription: >-
          Panura asks so ads can be kept relevant. Say no and you still get the
          same app, with generic ads instead.
    # Firebase config, copied into the bundle only if it exists.
    #
    # Not a source entry, even an `optional: true` one: that flag only stops
    # XcodeGen failing when the file is absent — the reference still lands in
    # the project, and the build then fails trying to copy a file that is not
    # there ("Build input file cannot be found"). The file is absent whenever the
    # GOOGLE_SERVICE_INFO_PLIST secret is, since the repo is public and CI writes
    # it from that secret. A script can check first; a resource entry cannot.
    #
    # Without the file the app skips Firebase at launch rather than crashing.
    postBuildScripts:
      - name: Bundle GoogleService-Info.plist if present
        basedOnDependencyAnalysis: false
        script: |
          SRC="${SRCROOT}/Resources/GoogleService-Info.plist"
          DEST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}"
          if [ -f "$SRC" ]; then
            cp "$SRC" "$DEST/GoogleService-Info.plist"
            echo "Bundled GoogleService-Info.plist"
          else
            echo "warning: no GoogleService-Info.plist; this build runs without Firebase"
          fi
          # The screenshot run's demo clip, on exactly the same terms: rendered
          # onto the runner by .github/workflows/ios-screenshots.yml just before
          # the build, absent everywhere else, and never in a release — the
          # only thing that reads it is ScreenshotMode, which is #if DEBUG.
          CLIP="${SRCROOT}/Resources/screenshot-demo.mp4"
          if [ -f "$CLIP" ]; then
            cp "$CLIP" "$DEST/screenshot-demo.mp4"
            echo "Bundled screenshot-demo.mp4"
          fi
    dependencies:
      - package: GoogleCast
        product: GoogleCast
      - package: GoogleMobileAds
      - package: Swifter
      - package: SafariConverterLib
        product: ContentBlockerConverter
      - package: VLCKit4
        product: VLCKit4
      - package: Firebase
        product: FirebaseCrashlytics
      - package: Firebase
        product: FirebaseAnalytics
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: panura.web.videoplayer
        # Xcode's own templates set this; a generated project has no default,
        # so without it the catalog compiles and the app still ships iconless.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Firebase registers its components from Objective-C +load methods in
        # static libraries. Without -ObjC the linker may drop those object files
        # as unreferenced, and Analytics then never starts — silently.
        OTHER_LDFLAGS: $(inherited) -ObjC
        # The plist script above reads a file it does not declare as an input,
        # because the file may legitimately not exist. The script sandbox would
        # refuse that read.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # Crashlytics turns a crash into file and line only with dSYMs.
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    # Without an explicit scheme the test target is autocreated into one of its
    # own, and `xcodebuild test -scheme PanuraPlayer` then finds nothing to run.
    scheme:
      testTargets:
        - PanuraScreenshots

  # App Store screenshots, captured in the simulator — see
  # Tests/Screenshots/StoreScreenshots.swift. Not a test suite: nothing here
  # asserts behaviour, and no other workflow runs it.
  PanuraScreenshots:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/Screenshots
    dependencies:
      - target: PanuraPlayer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: panura.web.videoplayer.screenshots
        TEST_TARGET_NAME: PanuraPlayer
        # A UI test bundle is signed and installed like an app. Nothing here
        # ever leaves a simulator, so it wants no team and no entitlements.
        CODE_SIGNING_ALLOWED: NO
