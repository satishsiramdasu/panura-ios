name: PanuraPlayer
options:
  bundleIdPrefix: com.panura
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "" # set on CI via env / xcconfig
    TARGETED_DEVICE_FAMILY: "1,2" # iPhone + iPad
    CODE_SIGN_STYLE: Automatic

packages:
  # Google ships no official SPM package; SRGSSR repackages the official
  # XCFrameworks. Module is still `GoogleCast`, so `import GoogleCast` is unchanged.
  GoogleCast:
    url: https://github.com/SRGSSR/google-cast-sdk
    from: "4.8.4"
  # v12+ introduced the un-prefixed Swift API (MobileAds/InterstitialAd/Request).
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: "12.0.0"
  Swifter:
    url: https://github.com/httpswift/swifter
    from: "1.5.0"
  # Converts EasyList/uBlock ABP filter lists into Safari content-blocker JSON.
  SafariConverterLib:
    url: https://github.com/AdguardTeam/SafariConverterLib
    from: "4.3.0"
  # VLCKit (libVLC) — Infuse-grade playback: every format + reliable HTTP
  # header support (Referer/User-Agent/Cookie) for gated streams. URL-based
  # binary xcframework (CI-friendly, no Git LFS).
  VLCKitSPM:
    url: https://github.com/tylerjonesio/vlckit-spm
    exactVersion: "3.6.0"

targets:
  PanuraPlayer:
    type: application
    platform: iOS
    sources:
      - Sources
    resources:
      - Resources/Assets.xcassets
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Panura
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true # extraction/browser hits arbitrary http hosts
        NSPhotoLibraryUsageDescription: Panura needs access to your videos to play and cast them.
        NSLocalNetworkUsageDescription: Panura discovers and casts to TVs on your local network.
        NSBonjourServices:
          - _googlecast._tcp
          - _panuracast._tcp
        UIBackgroundModes:
          - audio
        GADApplicationIdentifier: ca-app-pub-6998555111280991~0000000000 # TODO iOS AdMob app id
    dependencies:
      - package: GoogleCast
        product: GoogleCast
      - package: GoogleMobileAds
      - package: Swifter
      - package: SafariConverterLib
        product: ContentBlockerConverter
      - package: VLCKitSPM
        product: VLCKitSPM
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.panura.player
